<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <!-- Sky Gradient -->
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E88E5" />
      <stop offset="60%" stop-color="#64B5F6" />
      <stop offset="100%" stop-color="#BBDEFB" />
    </linearGradient>

    <!-- Red Brick Building Wall Gradient -->
    <linearGradient id="brickGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#C62828" />
      <stop offset="50%" stop-color="#D32F2F" />
      <stop offset="100%" stop-color="#B71C1C" />
    </linearGradient>

    <!-- Roof Gradient -->
    <linearGradient id="roofGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#37474F" />
      <stop offset="100%" stop-color="#212121" />
    </linearGradient>

    <!-- Green Ground Gradient -->
    <linearGradient id="groundGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4CAF50" />
      <stop offset="40%" stop-color="#388E3C" />
      <stop offset="100%" stop-color="#1B5E20" />
    </linearGradient>

    <!-- Tree Foliage Gradient -->
    <radialGradient id="treeLeafGrad" cx="40%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#66BB6A" />
      <stop offset="50%" stop-color="#2E7D32" />
      <stop offset="100%" stop-color="#003300" />
    </radialGradient>

    <!-- Wood Texture Gradient -->
    <linearGradient id="woodGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8D6E63" />
      <stop offset="50%" stop-color="#6D4C41" />
      <stop offset="100%" stop-color="#4E342E" />
    </linearGradient>
  </defs>

  <!-- Sky -->
  <rect width="1200" height="420" fill="url(#skyGrad)" />

  <!-- Clouds -->
  <path d="M150 120 Q180 90 220 100 Q260 80 300 110 Q340 90 370 120 Z" fill="#FFFFFF" opacity="0.8" />
  <path d="M750 90 Q780 60 820 70 Q860 50 900 80 Q940 60 970 90 Z" fill="#FFFFFF" opacity="0.85" />
  <path d="M480 60 Q500 40 530 50 Q560 30 590 55 Q620 40 640 60 Z" fill="#FFFFFF" opacity="0.7" />

  <!-- Background Mountain / Distant Trees -->
  <path d="M0 320 Q200 280 400 310 Q600 270 800 300 Q1000 260 1200 300 L1200 420 L0 420 Z" fill="#81C784" opacity="0.5" />

  <!-- Main Red Brick Kindergarten Building -->
  <!-- Left Wing Tower -->
  <rect x="360" y="240" width="150" height="180" fill="url(#brickGrad)" stroke="#5D4037" stroke-width="2" />
  <polygon points="350,240 435,180 520,240" fill="url(#roofGrad)" stroke="#212121" stroke-width="2" />
  <!-- Roof Dormer -->
  <polygon points="415,200 435,185 455,200" fill="#D32F2F" />
  <rect x="422" y="195" width="26" height="15" fill="#FFFFFF" />

  <!-- Main Center Building -->
  <rect x="500" y="260" width="350" height="160" fill="url(#brickGrad)" stroke="#5D4037" stroke-width="2" />
  <polygon points="490,260 675,210 860,260" fill="url(#roofGrad)" stroke="#212121" stroke-width="2" />

  <!-- Building Windows & Arches -->
  <!-- Tower Arched Windows (Upper Floor) -->
  <path d="M 410 270 A 15 15 0 0 1 440 270 L 440 300 L 410 300 Z" fill="#E0F7FA" stroke="#FFFFFF" stroke-width="3" />
  <!-- Main Building Arched Windows (Upper Floor) -->
  <path d="M 540 280 A 15 15 0 0 1 570 280 L 570 310 L 540 310 Z" fill="#E0F7FA" stroke="#FFFFFF" stroke-width="3" />
  <path d="M 610 280 A 15 15 0 0 1 640 280 L 640 310 L 610 310 Z" fill="#E0F7FA" stroke="#FFFFFF" stroke-width="3" />
  <path d="M 680 280 A 15 15 0 0 1 710 280 L 710 310 L 680 310 Z" fill="#E0F7FA" stroke="#FFFFFF" stroke-width="3" />
  <path d="M 750 280 A 15 15 0 0 1 780 280 L 780 310 L 750 310 Z" fill="#E0F7FA" stroke="#FFFFFF" stroke-width="3" />

  <!-- Ground Floor Windows / Doors -->
  <path d="M 540 340 A 15 15 0 0 1 570 340 L 570 380 L 540 380 Z" fill="#E0F7FA" stroke="#FFFFFF" stroke-width="3" />
  <path d="M 750 340 A 15 15 0 0 1 780 340 L 780 380 L 750 380 Z" fill="#E0F7FA" stroke="#FFFFFF" stroke-width="3" />
  <rect x="625" y="335" width="70" height="45" fill="#FFE082" stroke="#FFFFFF" stroke-width="3" />

  <!-- Colorful Accent Vertical Stripes on Building -->
  <rect x="655" y="260" width="10" height="60" fill="#E53E3E" />
  <rect x="735" y="260" width="10" height="60" fill="#43A047" />

  <!-- Outdoor Green Courtyard Floor -->
  <polygon points="0,390 1200,390 1200,675 0,675" fill="url(#groundGrad)" />

  <!-- Hopscotch White Markings on Courtyard (跳格子 1-10 Perspective) -->
  <g stroke="#FFFFFF" stroke-width="4" fill="none" opacity="0.85">
    <!-- Box 1 -->
    <polygon points="460,540 540,540 530,580 440,580" />
    <text x="480" y="568" fill="#FFFFFF" font-weight="bold" font-size="24" text-anchor="middle" font-family="sans-serif">10</text>

    <!-- Box 2 & 3 -->
    <polygon points="440,580 485,580 480,615 425,615" />
    <text x="455" y="605" fill="#FFFFFF" font-weight="bold" font-size="20" text-anchor="middle" font-family="sans-serif">9</text>
    <polygon points="485,580 530,580 535,615 480,615" />
    <text x="505" y="605" fill="#FFFFFF" font-weight="bold" font-size="20" text-anchor="middle" font-family="sans-serif">8</text>

    <!-- Box 4 -->
    <polygon points="425,615 535,615 540,645 415,645" />
    <text x="475" y="638" fill="#FFFFFF" font-weight="bold" font-size="22" text-anchor="middle" font-family="sans-serif">7</text>

    <!-- Box 5 & 6 -->
    <polygon points="415,645 475,645 470,670 400,670" />
    <text x="438" y="665" fill="#FFFFFF" font-weight="bold" font-size="18" text-anchor="middle" font-family="sans-serif">6</text>
    <polygon points="475,645 540,645 545,670 470,670" />
    <text x="508" y="665" fill="#FFFFFF" font-weight="bold" font-size="18" text-anchor="middle" font-family="sans-serif">5</text>
  </g>

  <!-- Left Side: Giant Umbrella Banyan / Topiary Tree -->
  <g>
    <!-- Trunk -->
    <path d="M 80 480 C 60 400 40 300 0 240 L 0 520 C 40 520 70 510 80 480 Z" fill="url(#woodGrad)" stroke="#3E2723" stroke-width="3" />
    <path d="M 0 380 Q 80 340 180 280 Q 240 220 280 160 Q 200 180 120 250 Z" fill="url(#woodGrad)" />

    <!-- Massive Mushroom / Umbrella Topiary Canopy -->
    <ellipse cx="180" cy="120" rx="220" ry="110" fill="url(#treeLeafGrad)" stroke="#1B5E20" stroke-width="4" />
    <ellipse cx="150" cy="90" rx="180" ry="80" fill="#4CAF50" opacity="0.3" />
    <ellipse cx="220" cy="130" rx="140" ry="70" fill="#2E7D32" opacity="0.4" />
  </g>

  <!-- Center Courtyard Garden Hedge / Bush -->
  <g>
    <path d="M 430 460 Q 480 420 530 430 Q 580 410 630 450 L 630 470 L 430 470 Z" fill="#2E7D32" stroke="#1B5E20" stroke-width="2" />
    <ellipse cx="480" cy="440" rx="35" ry="25" fill="#4CAF50" />
    <ellipse cx="560" cy="435" rx="45" ry="28" fill="#66BB6A" />
  </g>

  <!-- Far Left Background: Basketball Hoop Structure -->
  <g>
    <line x1="200" y1="420" x2="200" y2="330" stroke="#0288D1" stroke-width="6" />
    <rect x="180" y="300" width="40" height="30" fill="#FFFFFF" stroke="#D32F2F" stroke-width="3" />
    <rect x="192" y="312" width="16" height="12" fill="none" stroke="#D32F2F" stroke-width="2" />
    <path d="M 195 330 L 205 330 L 202 342 L 198 342 Z" fill="none" stroke="#FF9800" stroke-width="2" />
  </g>

  <!-- Right Side: Wooden Outdoor Playground & Climbing Wall -->
  <g>
    <!-- Wooden Climbing Structure Frame -->
    <rect x="920" y="340" width="220" height="150" fill="url(#woodGrad)" rx="8" stroke="#3E2723" stroke-width="3" />
    <!-- Climbing Holds (Colorful grips) -->
    <circle cx="950" cy="370" r="8" fill="#E53E3E" />
    <circle cx="980" cy="410" r="7" fill="#FFB300" />
    <circle cx="960" cy="450" r="8" fill="#1E88E5" />
    <circle cx="1020" cy="380" r="7" fill="#43A047" />
    <circle cx="1000" cy="430" r="8" fill="#8E24AA" />
    <circle cx="1060" cy="360" r="7" fill="#E53E3E" />
    <circle cx="1090" cy="420" r="8" fill="#FF8A65" />

    <!-- Yellow Crawl Tunnel / Slide Barrel -->
    <ellipse cx="1120" cy="420" rx="55" ry="55" fill="#FBC02D" stroke="#F57F17" stroke-width="6" />
    <ellipse cx="1120" cy="420" rx="38" ry="38" fill="#3E2723" />
    <ellipse cx="1120" cy="420" rx="30" ry="30" fill="#212121" />

    <!-- Safety Rubber Mat Border on Ground (Right Bottom) -->
    <polygon points="770,490 1200,490 1200,675 870,675" fill="#D84315" opacity="0.8" />
  </g>

  <!-- Header Banner Text Overlay (Subtle) -->
  <rect x="30" y="30" width="380" height="50" rx="25" fill="#FFFFFF" opacity="0.9" stroke="#5D4037" stroke-width="2" />
  <text x="50" y="62" font-family="sans-serif" font-weight="900" font-size="22" fill="#5D4037">愛愛幼兒園 綠意校園場景</text>
</svg>
